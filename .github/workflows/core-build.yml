name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: buildthehomelab/wow-ci/.github/workflows/ci.yml@main
    permissions:
      contents: read
      packages: read
  crafting-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check crafting economics
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/crafting_pricing_test.cpp -o /tmp/crafting-pricing-test
          /tmp/crafting-pricing-test
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/catalog_provider_test.cpp tests/catalog_consumer_test.cpp -o /tmp/catalog-provider-test
          /tmp/catalog-provider-test
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/bis_buyer_pricing_test.cpp -o /tmp/bis-buyer-test
          /tmp/bis-buyer-test
      - name: Check buyer safety and configuration ranges
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/buyer_safety_test.cpp -o /tmp/buyer-safety-test
          /tmp/buyer-safety-test
      - name: Check vendor-aware bag pricing
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/bag_pricing_test.cpp -o /tmp/bag-pricing-test
          /tmp/bag-pricing-test
      - name: Check recipe and category floor pricing
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/recipe_pricing_test.cpp -o /tmp/recipe-pricing-test
          /tmp/recipe-pricing-test
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/floor_pricing_test.cpp -o /tmp/floor-pricing-test
          /tmp/floor-pricing-test
      - name: Check material stock planning
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/material_stock_test.cpp -o /tmp/material-stock-test
          /tmp/material-stock-test
      - name: Validate published catalog and generated membership
        run: |
          python3 tools/build_bis_header.py --check
          python3 -m unittest discover -s tests -p 'test_*.py'
