name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: buildthehomelab/wow-ci/.github/workflows/ci.yml@main
    permissions:
      contents: read
      packages: read
  crafting-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check crafting economics
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/crafting_pricing_test.cpp -o /tmp/crafting-pricing-test
          /tmp/crafting-pricing-test
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/catalog_provider_test.cpp tests/catalog_consumer_test.cpp -o /tmp/catalog-provider-test
          /tmp/catalog-provider-test
      - name: Validate published catalog and generated membership
        run: |
          python3 tools/build_bis_header.py --check
          python3 -m unittest discover -s tests -p 'test_*.py'
